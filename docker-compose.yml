# docker compose up --build
#
# Requires back-end/.env (copy back-end/.env.example and add your Groq key).
# The frontend is served by nginx on http://localhost:8080 and talks to the
# backend on http://localhost:5000 from the browser, which is why VITE_API_URL
# is a host address and not a compose service name.
services:
  backend:
    build:
      context: ./back-end
    ports:
      - "5000:5000"
    env_file:
      - ./back-end/.env
    environment:
      # Development CORS origins include http://localhost:8080, which is where
      # the frontend container is published.
      NODE_ENV: development
    restart: unless-stopped

  frontend:
    build:
      context: ./front-end
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:5000}
    ports:
      - "8080:80"
    depends_on:
      - backend
    restart: unless-stopped
