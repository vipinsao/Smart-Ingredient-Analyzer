name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  backend:
    name: back-end (install + unit tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: back-end
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: back-end/package-lock.json

      - run: npm ci

      # No API key is needed: every test here covers pure logic (validation,
      # schema coercion, image transforms) or stubs the model call.
      - run: npm test

  frontend:
    name: front-end (install + lint + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: front-end
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: front-end/package-lock.json

      - run: npm ci

      - run: npm run lint

      - run: npm run build
        env:
          VITE_API_URL: http://localhost:5000
